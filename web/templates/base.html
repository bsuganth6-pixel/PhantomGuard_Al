<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PhantomGuard AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  // Set the theme before first paint so there's no flash of the wrong
  // theme -- runs synchronously, before CSS/body render.
  (function () {
    var saved = localStorage.getItem("phantomguard-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<nav class="topnav">
  <a href="{{ url_for('index') }}" class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linejoin="round">
        <path d="M12 2L4 5v6c0 5.2 3.4 9.4 8 11 4.6-1.6 8-5.8 8-11V5l-8-3z"/>
        <path d="M9 12l2 2 4-4" stroke-width="2"/>
      </svg>
    </span>
    <span>PhantomGuard <span class="accent">AI</span></span>
  </a>
  <div class="navlinks">
    <a href="{{ url_for('index') }}">Scan</a>
    <a href="{{ url_for('history') }}">History</a>
    <span class="tag">Phantom Security</span>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark theme" title="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</nav>

<main class="page">
  {% block content %}{% endblock %}
</main>

<footer class="sitefoot">
  <span>PhantomGuard AI &middot; Regional-Language Phishing &amp; Scam Defense</span>
  <span>Detection-first &middot; Never exploitation</span>
</footer>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
